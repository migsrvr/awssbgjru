name: CD — Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Pre-Deploy Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-docker.txt

      - name: Install lightweight dependencies & run backend tests
        run: |
          pip install -r backend/requirements-docker.txt
          python -m unittest discover -s backend/tests -v
          python -m unittest tests/test_registration_ribbons.py -v

      - name: Set up Node.js & run frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/admin-qr-auto-fetch.test.cjs tests/division-availability.test.cjs

  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase GHCR image prefix (GitHub Org transfer-safe)
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-backend:latest
            ${{ steps.meta.outputs.image_prefix }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-web:latest
            ${{ steps.meta.outputs.image_prefix }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy to AWS EC2 via SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.EC2_HOST != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/opt/awssbgjru"

      - name: Pull images and restart containers on EC2
        uses: appleboy/ssh-action@v1.1.0
        env:
          GHCR_IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_IMAGE_PREFIX,IMAGE_TAG,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            cd /opt/awssbgjru

            # Optional GHCR login if the repo is made private inside your GitHub Organization
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            fi

            export GHCR_IMAGE_PREFIX="$GHCR_IMAGE_PREFIX"
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Wait up to 30s for backend container healthcheck
            for i in $(seq 1 15); do
              if docker inspect --format='{{.State.Health.Status}}' awssbgjru-backend 2>/dev/null | grep -q "healthy"; then
                echo "Backend is healthy!"
                break
              fi
              sleep 2
            done

            # Clean up old unused images so the 25 GB gp3 volume never fills up
            docker image prune -f
