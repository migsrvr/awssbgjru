name: CI — Tests & Docker Build Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend-tests:
    name: Python Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-docker.txt

      - name: Install lightweight backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-docker.txt

      - name: Run backend test suite
        run: |
          python -m unittest discover -s backend/tests -v
          python -m unittest tests/test_registration_ribbons.py -v

  frontend-tests:
    name: Node Frontend & Availability Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Node tests
        run: |
          node --test tests/admin-qr-auto-fetch.test.cjs tests/division-availability.test.cjs

  docker-build-check:
    name: Validate Docker Builds (Backend & Web)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (dry run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web Caddy image (dry run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
