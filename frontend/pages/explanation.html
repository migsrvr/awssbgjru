<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tell us why you want to join AWS Student Builder Group JRU Chapter at José Rizal University. Share your passion for cloud computing and AWS technology." />
    <meta name="keywords" content="AWS JRU join, AWS Student Builder Group application, why join AWS club JRU" />
    <meta name="robots" content="index, follow" />
    <title>Membership Explanation - AWS Student Builder Group JRU</title>
    <link rel="canonical" href="https://awssbgjru.me/explanation" />
    <link rel="icon" type="image/png" href="../assets/shared/components/AWS-NewLogo.png" />
    <meta property="og:title" content="Membership Explanation - AWS Student Builder Group JRU" />
    <meta property="og:description" content="Tell us why you want to join AWS Student Builder Group JRU Chapter at José Rizal University." />
    <meta property="og:image" content="https://awssbgjru.me/assets/shared/og-image.png" />
    <meta property="og:url" content="https://awssbgjru.me/explanation" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AWS Student Builder Group - JRU Chapter" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Membership Explanation - AWS Student Builder Group JRU" />
    <meta name="twitter:description" content="Tell us why you want to join AWS Student Builder Group JRU Chapter at José Rizal University." />
    <meta name="twitter:image" content="https://awssbgjru.me/assets/shared/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700&family=Lexend+Deca:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/register.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/explanation.css" />
    <script defer src="../js/main.js"></script>
    <script defer src="../js/nav.js"></script>
  </head>
  <body class="register-page register-step-2">
    <main class="register-main">
      <!-- Header component container for mobile menu -->
      <div id="header-placeholder"></div>
      <div class="register-card">

        <!-- Back button -->
        <a href="/register" class="register-back">
          <span class="register-back-arrow"></span>
          <span class="register-back-text">Back</span>
        </a>

        <!-- Title -->
        <h1 class="register-title">Sign up</h1>

        <!-- Progress steps: step 1 completed, step 2 current, step 3 upcoming -->
        <div class="register-progress">
          <div class="progress-step">
            <div class="progress-circle filled"></div>
          </div>
          <div class="progress-line filled"></div>
          <div class="progress-step">
            <div class="progress-circle filled"></div>
          </div>
          <div class="progress-line"></div>
          <div class="progress-step">
            <div class="progress-circle"></div>
          </div>
        </div>

        <!-- Section title -->
        <h2 class="register-section-title explanation-section-title">Why do you want to be a member of AWS - JRU?</h2>

        <!-- Explanation textarea & Resume Attachment -->
        <div class="explanation-box">
          <div class="form-group">
            <textarea class="explanation-textarea" id="explanationText" placeholder="Explain here." maxlength="5000"></textarea>
            <div class="form-error" data-for="explanation">
              <span class="error-icon"></span>
              <span class="error-text">Please input a brief explanation</span>
            </div>
          </div>

          <!-- Resume Attachment Area -->
          <div class="resume-attachment-area">
            <div class="resume-pill-container">
              <label for="resumeInput" class="resume-attachment-pill" id="btnResumeLabel" tabindex="0" role="button" aria-label="Attach Resume (Optional)">
                <svg class="resume-clip-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
                <span class="resume-pill-text" id="resumePillText">Attach Resume (Optional)</span>
              </label>
              <input type="file" id="resumeInput" accept=".pdf,.doc,.docx,image/*" style="display:none;" />
              <button type="button" class="btn-remove-resume" id="btnRemoveResume" aria-label="Remove resume" style="display:none;" title="Remove file">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <span class="resume-format-hint">Accepted formats: PDF, DOC, DOCX (Max 3MB)</span>
            <div class="form-error resume-error" data-for="resume" role="status" aria-live="polite">
              <span class="error-icon"></span>
              <span class="error-text">File must be under 3MB.</span>
            </div>
          </div>
        </div>

        <!-- Submit -->
        <div class="form-submit-row explanation-submit-row">
          <button type="submit" class="btn-save" id="btnSave">Save &amp; Continue</button>
        </div>

      </div>
    </main>
    <script src="../js/explanation.js"></script>
  </body>
</html>
