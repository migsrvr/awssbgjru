<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choose your Skill Builder Division when joining AWS Student Builder Group JRU Chapter at José Rizal University. Pick from cloud computing specializations to build your AWS expertise." />
    <meta name="keywords" content="AWS JRU skill builder, AWS Student Builder Group division, JRU cloud specialization, AWS SGB skill track" />
    <meta name="robots" content="index, follow" />
    <title>Skill Builder Division - AWS Student Builder Group JRU</title>
    <link rel="canonical" href="https://awssbgjru.me/skillbuilder" />
    <link rel="icon" type="image/png" href="../assets/shared/components/AWS-NewLogo.png" />
    <meta property="og:title" content="Skill Builder Division - AWS Student Builder Group JRU" />
    <meta property="og:description" content="Choose your Skill Builder Division when joining AWS Student Builder Group JRU Chapter at José Rizal University." />
    <meta property="og:image" content="https://awssbgjru.me/assets/shared/og-image.png" />
    <meta property="og:url" content="https://awssbgjru.me/skillbuilder" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AWS Student Builder Group - JRU Chapter" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skill Builder Division - AWS Student Builder Group JRU" />
    <meta name="twitter:description" content="Choose your Skill Builder Division when joining AWS Student Builder Group JRU Chapter at José Rizal University." />
    <meta name="twitter:image" content="https://awssbgjru.me/assets/shared/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700&family=Lexend+Deca:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/register.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/department.css" />
    <link rel="stylesheet" href="../css/skillbuilder.css" />
    <link rel="stylesheet" href="../css/division-availability.css" />
    <script defer src="../js/main.js"></script>
    <script defer src="../js/nav.js"></script>
  </head>
  <body class="register-page register-step-dept">
    <main class="register-main">
      <!-- Header component container for mobile menu -->
      <div id="header-placeholder"></div>
      <div class="register-card">

        <!-- Back button -->
        <a href="/department" class="register-back">
          <span class="register-back-arrow"></span>
          <span class="register-back-text">Back</span>
        </a>

        <h1 class="register-title">Sign up</h1>

        <div class="register-progress">
          <div class="progress-step">
            <div class="progress-circle filled"></div>
          </div>
          <div class="progress-line filled"></div>
          <div class="progress-step">
            <div class="progress-circle filled"></div>
          </div>
          <div class="progress-line filled"></div>
          <div class="progress-step">
            <div class="progress-circle filled"></div>
          </div>
        </div>

        <div class="sb-content">
          <h2 class="sb-section-title">SKILL BUILDER : Choose a Skill Builder Division</h2>
          <div class="sb-grid">
            <button class="sb-pill" data-division="Software &amp; Web Dev." data-availability="open">
              <span class="division-copy">
                <span class="division-label">Software &amp; Web Dev.</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img src="../assets/registration/ribbons/skillbuilder-open.svg" alt="" />
              </span>
            </button>
            <button class="sb-pill" data-division="Security" data-availability="full" aria-disabled="true">
              <span class="division-copy">
                <span class="division-label">Security</span>
                <span class="division-note division-unavailable-note" role="status" aria-live="polite">This team is full! Please choose another!</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img src="../assets/registration/ribbons/skillbuilder-full.svg" alt="" />
              </span>
            </button>
            <button class="sb-pill" data-division="Data Analyst" data-availability="full" aria-disabled="true">
              <span class="division-copy">
                <span class="division-label">Data Analyst</span>
                <span class="division-note division-unavailable-note" role="status" aria-live="polite">This team is full! Please choose another!</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img src="../assets/registration/ribbons/skillbuilder-full.svg" alt="" />
              </span>
            </button>
            <button class="sb-pill" data-division="Cloud Computing" data-availability="full" aria-disabled="true">
              <span class="division-copy">
                <span class="division-label">Cloud Computing</span>
                <span class="division-note division-unavailable-note" role="status" aria-live="polite">This team is full! Please choose another!</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img src="../assets/registration/ribbons/skillbuilder-full.svg" alt="" />
              </span>
            </button>
            <button class="sb-pill" data-division="Machine Learning &amp; AI" data-availability="full" aria-disabled="true">
              <span class="division-copy">
                <span class="division-label">Machine Learning &amp; AI</span>
                <span class="division-note division-unavailable-note" role="status" aria-live="polite">This team is full! Please choose another!</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img src="../assets/registration/ribbons/skillbuilder-full.svg" alt="" />
              </span>
            </button>
            <button class="sb-pill" data-division="Advanced Network &amp; Infrastructure" data-availability="full" aria-disabled="true">
              <span class="division-copy">
                <span class="division-label">Advanced Network &amp; Infrastructure</span>
                <span class="division-note division-unavailable-note" role="status" aria-live="polite">This team is full! Please choose another!</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img src="../assets/registration/ribbons/skillbuilder-full.svg" alt="" />
              </span>
            </button>
          </div>
          <div class="form-error sb-error" data-for="skillbuilder" role="status" aria-live="polite">
            <span class="error-icon"></span>
            <span class="error-text">To proceed, please select a Skill Builder Division</span>
          </div>
          <div class="form-error sb-error-api" data-for="skillbuilder-api">
            <span class="error-icon"></span>
            <span class="error-text">Something went wrong. Please check your connection and try again.</span>
          </div>
          <div class="form-submit-row sb-submit-row">
            <button type="submit" class="btn-save" id="btnSaveSB">Submit</button>
          </div>
        </div>

      </div>
    </main>
    <script src="../js/division-availability.js"></script>
    <script src="../js/skillbuilder.js"></script>
  </body>
</html>
