<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choose your Office Division when joining AWS Student Builder Group JRU Chapter at José Rizal University. Select from executive and leadership tracks in cloud computing." />
    <meta name="keywords" content="AWS JRU office division, AWS Student Builder Group leadership, JRU cloud club office, AWS SGB officer" />
    <meta name="robots" content="index, follow" />
    <title>Office Division - AWS Student Builder Group JRU</title>
    <link rel="canonical" href="https://awssbgjru.me/office" />
    <link rel="icon" type="image/png" href="../assets/shared/components/AWS-NewLogo.png" />
    <meta property="og:title" content="Office Division - AWS Student Builder Group JRU" />
    <meta property="og:description" content="Choose your Office Division when joining AWS Student Builder Group JRU Chapter at José Rizal University." />
    <meta property="og:image" content="https://awssbgjru.me/assets/shared/og-image.png" />
    <meta property="og:url" content="https://awssbgjru.me/office" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AWS Student Builder Group - JRU Chapter" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Office Division - AWS Student Builder Group JRU" />
    <meta name="twitter:description" content="Choose your Office Division when joining AWS Student Builder Group JRU Chapter at José Rizal University." />
    <meta name="twitter:image" content="https://awssbgjru.me/assets/shared/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700&family=Lexend+Deca:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/register.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/department.css" />
    <link rel="stylesheet" href="../css/office.css" />
    <link rel="stylesheet" href="../css/division-availability.css?v=badge-color-20260817" />
    <script defer src="../js/main.js"></script>
    <script defer src="../js/nav.js"></script>
  </head>
  <body class="register-page register-step-dept">
    <main class="register-main">
      <!-- Header component container for mobile menu -->
      <div id="header-placeholder"></div>
      <div class="register-card">

        <!-- Back button -->
        <a href="/department" class="register-back">
          <span class="register-back-arrow"></span>
          <span class="register-back-text">Back</span>
        </a>

        <h1 class="register-title">Sign up</h1>

        <div class="register-progress">
          <div class="progress-step">
            <div class="progress-circle filled"></div>
          </div>
          <div class="progress-line filled"></div>
          <div class="progress-step">
            <div class="progress-circle filled"></div>
          </div>
          <div class="progress-line filled"></div>
          <div class="progress-step">
            <div class="progress-circle filled"></div>
          </div>
        </div>

        <div class="office-content">
          <h2 class="office-section-title">OFFICES : Choose a Office Division</h2>
          <div class="office-grid">
            <button class="office-pill" data-division="Relations" data-availability="open" data-eligible-years="First Year">
              <span class="division-copy">
                <span class="division-label">Relations</span>
                <span class="division-note">Open for <strong>1st year</strong></span>
                <span class="division-note division-eligibility-note" role="status" aria-live="polite">Relations is open only to 1st year students.</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img class="ribbon-default" src="../assets/registration/ribbons/open.svg" alt="" />
                <img class="ribbon-selected" src="../assets/registration/ribbons/open-selected.svg" alt="" />
              </span>
            </button>
            <button class="office-pill" data-division="Operations" data-availability="open">
              <span class="division-copy">
                <span class="division-label">Operations</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img class="ribbon-default" src="../assets/registration/ribbons/open.svg" alt="" />
                <img class="ribbon-selected" src="../assets/registration/ribbons/open-selected.svg" alt="" />
              </span>
            </button>
            <button class="office-pill" data-division="Technology" data-availability="open">
              <span class="division-copy">
                <span class="division-label">Technology</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img class="ribbon-default" src="../assets/registration/ribbons/open.svg" alt="" />
                <img class="ribbon-selected" src="../assets/registration/ribbons/open-selected.svg" alt="" />
              </span>
            </button>
            <button class="office-pill" data-division="Creatives" data-availability="open" data-eligible-years="First Year,Second Year">
              <span class="division-copy">
                <span class="division-label">Creatives</span>
                <span class="division-note">Open for <strong>1st year</strong> and <strong>2nd year</strong></span>
                <span class="division-note division-eligibility-note" role="status" aria-live="polite">Creatives is open only to 1st and 2nd year students.</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img class="ribbon-default" src="../assets/registration/ribbons/open.svg" alt="" />
                <img class="ribbon-selected" src="../assets/registration/ribbons/open-selected.svg" alt="" />
              </span>
            </button>
            <button class="office-pill" data-division="Marketing" data-availability="full" aria-disabled="true">
              <span class="division-copy">
                <span class="division-label">Marketing</span>
                <span class="division-note division-unavailable-note" role="status" aria-live="polite">This team is full! Please choose another!</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img src="../assets/registration/ribbons/full.svg" alt="" />
              </span>
            </button>
            <button class="office-pill" data-division="Media" data-availability="full" aria-disabled="true">
              <span class="division-copy">
                <span class="division-label">Media</span>
                <span class="division-note division-unavailable-note" role="status" aria-live="polite">This team is full! Please choose another!</span>
              </span>
              <span class="availability-ribbon" aria-hidden="true">
                <img src="../assets/registration/ribbons/full.svg" alt="" />
              </span>
            </button>
          </div>
          <div class="form-error office-error" data-for="office" role="status" aria-live="polite">
            <span class="error-icon"></span>
            <span class="error-text">To proceed, please select a Office Division</span>
          </div>
          <div class="form-error office-error-api" data-for="office-api">
            <span class="error-icon"></span>
            <span class="error-text">Something went wrong. Please check your connection and try again.</span>
          </div>
          <div class="form-submit-row office-submit-row">
            <button type="submit" class="btn-save" id="btnSaveOffice">Submit</button>
          </div>
        </div>

      </div>
    </main>
    <script src="../js/division-availability.js?v=badge-color-20260817"></script>
    <script src="../js/office.js?v=badge-color-20260817"></script>
  </body>
</html>
